# Tranquility（致远）主题配置（只覆盖需要修改的项，其余使用主题包默认值）
# 完整配置说明：https://docs.qwrcb.top

slogan: "宁静致远"
email: ""
logo: "/images/logo.svg"
color_mode: light
homepage_mode: blog
mathjax: true

# 子页：每个子页对应一个文章分类，在导航栏拥有一级入口
subpage:
  enable: true
  pages:
    - name: VLN
      path: vln
      title: VLN
      icon: /images/icon/icon-link.svg
      description: 视觉语言导航
    - name: 机器学习
      path: ml
      title: 机器学习
      icon: /images/icon/icon-pi.svg
      description: 机器学习基础与方法
    - name: 深度学习
      path: dl
      title: 深度学习
      icon: /images/icon/icon-app.svg
      description: 神经网络与表示学习
    - name: 强化学习
      path: rl
      title: 强化学习
      icon: /images/icon/icon-event.svg
      description: 策略、价值与决策
    - name: 大模型
      path: llm
      title: 大模型
      icon: /images/icon/icon-book.svg
      description: 大语言模型与多模态
    - name: 随笔
      path: essay
      title: 随笔
      icon: /images/icon/icon-article.svg
      description: 日常记录与思考

# 首页个性化内容
index:
  motto: "慢慢来，比较快"
  poem:
    - 君不见高堂明镜悲白发
    - 朝如青丝暮成雪
  photo: /images/about.jpg
  about:
    title: 关于

social:
  - name: GitHub
    icon: /images/logo-github.svg
    url: https://github.com/lengbai03

# 数组在 Hexo 的深合并中无法用 [] 清空，用 false 关闭整个区块
contacts: false
links: false

nav:
  sticky: false
  about: true
  archive: false

# 相关文章需要 hexo-related-popular-posts 插件，暂不开启
related_post:
  enable: false

# 暂无带 timeline 字段的文章时关闭，避免空区块撑出大片留白
timeline:
  enable: false
